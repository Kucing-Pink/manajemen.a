<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Manajemen A</title>
  <style>
    @font-face{font-family:'Pin Sans';src:url('https://s.pinimg.com/webapp/Pin-Sans-MacOS-Regular-708c49dd.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Pin Sans';src:url('https://s.pinimg.com/webapp/Pin-Sans-MacOS-Medium-704a4f34.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'Pin Sans';src:url('https://s.pinimg.com/webapp/Pin-Sans-MacOS-Bold-ce475d98.woff2') format('woff2');font-weight:700;font-display:swap}
    :root{--red:#E60023;--white:#FFF;--black:#111;--g50:#FAFAFA;--g100:#F6F6F3;--g200:#EFEFEB;--g300:#CDCDCD;--g400:#767676;--g500:#5F5F5F;--blue:#0866FF;--green:#068440;--orange:#DB5B06;--ff:'Pin Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--ff);background:var(--g50);color:var(--black);min-height:100vh;display:flex;flex-direction:column}

    .hdr{position:fixed;top:0;left:0;right:0;height:64px;background:var(--white);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:1000;box-shadow:0 1px 0 var(--g200)}
    .logo{width:24px;height:24px;flex-shrink:0}.logo svg{width:100%;height:100%}
    .nl{padding:8px 16px;border-radius:24px;font-size:16px;font-weight:600;text-decoration:none;color:var(--black);transition:background .2s}
    .nl:hover{background:var(--g200)}.nl.on{background:var(--black);color:var(--white)}
    .ha{display:flex;align-items:center;gap:4px;margin-left:auto}
    .ib{width:40px;height:40px;border-radius:50%;border:none;background:0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
    .ib:hover{background:var(--g200)}.ib svg{width:24px;height:24px}
    .login-btn{padding:8px 16px;border-radius:24px;background:var(--g200);color:var(--black);font-size:14px;font-weight:700;font-family:var(--ff);border:none;cursor:pointer;transition:all .2s}
    .login-btn:hover{opacity:.85}

    .main{padding:88px 24px 48px;max-width:600px;width:100%;margin:0 auto;flex:1}

    .profile-card{background:var(--white);border-radius:20px;border:1px solid var(--g200);overflow:hidden;margin-bottom:20px}
    .profile-banner{height:120px;background:linear-gradient(135deg,var(--red),#583B91);position:relative}
    .profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--white);border:4px solid var(--white);position:absolute;bottom:-40px;left:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .profile-avatar svg{width:40px;height:40px;color:var(--g400)}
    .profile-info{padding:52px 24px 24px}
    .profile-name{font-size:22px;font-weight:700;margin-bottom:2px}
    .profile-phone{font-size:14px;color:var(--g500);margin-bottom:16px}
    .profile-stats{display:flex;gap:24px;padding:0 24px 20px}
    .profile-stat{text-align:center}
    .profile-stat-val{font-size:20px;font-weight:700}
    .profile-stat-label{font-size:12px;color:var(--g500)}

    .section{background:var(--white);border-radius:16px;border:1px solid var(--g200);padding:20px;margin-bottom:16px}
    .section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .section-title svg{width:20px;height:20px;color:var(--g500)}

    .form-group{margin-bottom:16px}
    .form-group:last-child{margin-bottom:0}
    .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    .form-group input{width:100%;height:44px;border:1px solid var(--g200);border-radius:10px;padding:0 14px;font-size:14px;font-family:var(--ff);outline:none;transition:border-color .2s}
    .form-group input:focus{border-color:var(--blue)}
    .form-group input::placeholder{color:var(--g400)}

    .btn{padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;font-family:var(--ff);cursor:pointer;transition:all .2s;border:none;display:inline-flex;align-items:center;gap:8px}
    .btn-primary{background:var(--blue);color:var(--white)}.btn-primary:hover{background:#0758d9}
    .btn-danger{background:var(--red);color:var(--white)}.btn-danger:hover{background:#c5001a}
    .btn-ghost{background:transparent;color:var(--g500);border:1px solid var(--g200)}.btn-ghost:hover{background:var(--g100)}
    .btn-row{display:flex;gap:10px;margin-top:16px}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--black);color:var(--white);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:5000;transition:transform .3s;box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .toast.show{transform:translateX(-50%) translateY(0)}

    .empty-state{text-align:center;padding:48px 24px;color:var(--g400)}
    .empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.5}
    .empty-state p{font-size:14px}

    .msg-list{display:flex;flex-direction:column;gap:8px}
    .msg-item{padding:12px;border-radius:12px;background:var(--g50);border:1px solid var(--g200);display:flex;align-items:center;gap:12px}
    .msg-icon{width:36px;height:36px;border-radius:50%;background:var(--g200);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .msg-icon svg{width:18px;height:18px;color:var(--g500)}
    .msg-body{flex:1;min-width:0}
    .msg-text{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-time{font-size:12px;color:var(--g400)}
    .msg-status{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
    .msg-status.read{background:var(--g300)}
  </style>
</head>
<body>
<header class="hdr">
  <a href="index.html" class="logo"><svg viewBox="0 0 24 24" fill="#E60023"><path d="M12 0C5.373 0 0 5.373 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738a.36.36 0 01.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.889-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.632-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg></a>
  <a href="index.html" class="nl">Home</a>
  <a href="index.html#gallery" class="nl">Gallery</a>
  <a href="edukasi.html" class="nl">Edukasi</a>
  <a href="tools.html" class="nl">Tools</a>
  <div class="ha">
    <button class="login-btn" id="loginBtn">Profile</button>
  </div>
</header>

<main class="main">
  <div class="profile-card">
    <div class="profile-banner">
      <div class="profile-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
    <div class="profile-info">
      <div class="profile-name" id="userName">Loading...</div>
      <div class="profile-phone" id="userPhone">--</div>
    </div>
    <div class="profile-stats">
      <div class="profile-stat"><div class="profile-stat-val" id="statSent">0</div><div class="profile-stat-label">Messages Sent</div></div>
      <div class="profile-stat"><div class="profile-stat-val" id="statJoined">--</div><div class="profile-stat-label">Joined</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit Profile
    </div>
    <div class="form-group"><label>Display Name</label><input type="text" id="editName" placeholder="Enter your name"></div>
    <div class="form-group"><label>Phone</label><input type="tel" id="editPhone" disabled style="background:var(--g50);color:var(--g400)"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveProfile">Save Changes</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Change Password
    </div>
    <div class="form-group"><label>Current Password</label><input type="password" id="currentPw" placeholder="Enter current password"></div>
    <div class="form-group"><label>New Password</label><input type="password" id="newPw" placeholder="Min. 4 characters"></div>
    <div class="form-group"><label>Confirm New Password</label><input type="password" id="confirmPw" placeholder="Re-enter new password"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="changePw">Update Password</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      My Messages
    </div>
    <div class="msg-list" id="myMessages">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <p>Loading messages...</p>
      </div>
    </div>
  </div>

  <div class="btn-row" style="justify-content:center;padding:16px 0">
    <button class="btn btn-danger" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </div>
</main>

<div class="toast" id="toast">Saved</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxPYX8rqMUnxac4nVVgkZ42NvUkt6AZ3C_ltNchisXn_oY8ZA_AI3UKpkXsFlY0cW1Gpg/exec';
let currentUser = null;
let allUsers = [];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

const urlPhone = new URLSearchParams(window.location.search).get('phone');
const phone = urlPhone || localStorage.getItem('ma_phone');
const savedName = localStorage.getItem('ma_name');

if (phone && urlPhone) {
  localStorage.setItem('ma_phone', phone);
  localStorage.setItem('ma_loggedIn', 'true');
}

if (phone) {
  document.getElementById('userName').textContent = savedName || 'No name set';
  document.getElementById('userPhone').textContent = phone;
  document.getElementById('editName').value = savedName || '';
  document.getElementById('editPhone').value = phone;
} else {
  document.getElementById('userName').textContent = 'Guest';
  document.getElementById('userPhone').textContent = 'Not logged in';
  document.getElementById('editName').value = '';
  document.getElementById('editPhone').value = '';
}

async function loadProfile() {
  if (!phone) return;
  try {
    allUsers = await fetch(API_URL + '?action=getUsers').then(r => r.json());
    currentUser = allUsers.find(u => u.phone === phone);
    if (currentUser) {
      document.getElementById('userName').textContent = currentUser.name || 'No name set';
      document.getElementById('userPhone').textContent = currentUser.phone;
      document.getElementById('editName').value = currentUser.name || '';
      document.getElementById('editPhone').value = currentUser.phone;
      document.getElementById('statJoined').textContent = currentUser.joined || '--';
    }
  } catch(err) {
    console.error('Profile load error:', err);
  }
}

async function loadMyMessages() {
  if (!phone) {
    document.getElementById('myMessages').innerHTML = '<div class="empty-state"><p>Login to see your messages</p></div>';
    return;
  }
  try {
    const msgs = await fetch(API_URL + '?action=getMessages').then(r => r.json());
    const mine = msgs.filter(m => m.sender === phone);
    const list = document.getElementById('myMessages');
    if (mine.length === 0) {
      list.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><p>No messages yet</p></div>';
      document.getElementById('statSent').textContent = '0';
      return;
    }
    document.getElementById('statSent').textContent = mine.length;
    list.innerHTML = mine.slice(-10).reverse().map(m => `
      <div class="msg-item">
        <div class="msg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
        <div class="msg-body">
          <div class="msg-text">${m.message}</div>
          <div class="msg-time">${m.time}</div>
        </div>
        <div class="msg-status ${m.status === 'read' ? 'read' : ''}"></div>
      </div>
    `).join('');
  } catch(err) {
    console.error('Messages load error:', err);
  }
}

document.getElementById('saveProfile').addEventListener('click', async () => {
  const name = document.getElementById('editName').value.trim();
  if (!name) { showToast('Name cannot be empty'); return; }
  if (!phone) { showToast('Not logged in'); return; }
  localStorage.setItem('ma_name', name);
  document.getElementById('userName').textContent = name;
  try {
    if (currentUser) {
      await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({action:'updateUser', id:currentUser.id, name:name, phone:currentUser.phone, status:currentUser.status})
      });
    }
    showToast('Profile updated');
  } catch(err) { showToast('Failed to save'); }
});

document.getElementById('changePw').addEventListener('click', async () => {
  const cur = document.getElementById('currentPw').value;
  const npw = document.getElementById('newPw').value;
  const cpw = document.getElementById('confirmPw').value;
  if (!cur || !npw || !cpw) { showToast('Fill all fields'); return; }
  if (!phone) { showToast('Not logged in'); return; }
  if (npw.length < 4) { showToast('Min 4 characters'); return; }
  if (npw !== cpw) { showToast('Passwords do not match'); return; }
  try {
    if (currentUser) {
      await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({action:'updateUser', id:currentUser.id, phone:currentUser.phone, password:npw})
      });
    }
    localStorage.setItem('ma_password', npw);
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';
    document.getElementById('confirmPw').value = '';
    showToast('Password updated');
  } catch(err) { showToast('Failed to update'); }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  if (confirm('Are you sure you want to logout?')) {
    localStorage.removeItem('ma_loggedIn');
    localStorage.removeItem('ma_phone');
    localStorage.removeItem('ma_password');
    localStorage.removeItem('ma_name');
    window.location.href = 'index.html';
  }
});

document.getElementById('loginBtn').addEventListener('click', () => {
  window.location.href = 'index.html';
});

loadProfile();
loadMyMessages();
</script>
</body>
</html>
